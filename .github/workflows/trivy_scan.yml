name: Scan, Block, and Push Image CI 🚀
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan_and_push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. CHECKOUT: Get the repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # 2. LOGIN: Required to push to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          # Use a Docker PAT or password stored securely in GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # 3. BUILD & TAG: Build the Dockerfile and tag it locally
      - name: Build and Tag Image
        run: docker build -t peace5/cosign-test-app:1.0 . 
      
      # --- TRIVY SCANNING (BLOCKING STEP) ---
      # 4. SCAN: Scans the locally built image. Fails the job if CRITICAL/HIGH are found.
      - name: 🚨 Scan Container Image and Block Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          # This should be the same tag used in the build step
          image-ref: 'peace5/cosign-test-app:1.0'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # --- SBOM GENERATION ---
      # 5. SBOM: Generates the SBOM. Runs even if the scan failed (if: always()).
      - name: Generate SBOM (CycloneDX format)
        if: always()
        run: |
          trivy image --format cyclonedx --output sbom.json peace5/cosign-test-app:1.0
      
      # --- ARTIFACT UPLOAD ---
      # 6. ARTIFACT: Uploads the SBOM file to the GitHub run. Runs even if the scan failed.
      - name: Upload SBOM as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}_sbom
          path: sbom.json
      
      # --- FINAL PUSH (CONDITIONAL STEP) ---
      # 7. PUSH: Only pushes if the critical Trivy scan step passed successfully.
      - name: Push Image to Registry
        if: success()
        run: docker push peace5/cosign-test-app:1.0
